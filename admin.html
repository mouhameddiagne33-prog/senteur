<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Maison Diagne Senteur</title>
<style>
:root{--bleu:#0b2a4a;--vert:#1faa59;--gris:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--gris);color:#1d2633}
header{background:var(--bleu);color:#fff;padding:14px 20px}
header h1{font-size:1.05rem;margin:0}
header small{opacity:.75}
.wrap{max-width:1000px;margin:auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 4px 14px rgba(11,42,74,.08);margin-bottom:18px}
.card h2{margin:0 0 12px;color:var(--bleu);font-size:1.05rem}
label{display:block;font-size:.85rem;font-weight:600;color:var(--bleu);margin:10px 0 4px}
input,textarea{width:100%;padding:9px 11px;border:1px solid #c9d2de;border-radius:8px;font:inherit}
input[type=checkbox]{width:auto}
textarea{min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
button{font:inherit;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--bleu);color:#fff}
button:hover{opacity:.9}
button.vert{background:var(--vert)}
button.gris{background:#8795a8}
button.rouge{background:#c0392b}
.tabs{margin-bottom:14px;display:flex;gap:8px}
.tabs button{background:#dfe6ef;color:var(--bleu)}
.tabs button.on{background:var(--bleu);color:#fff}
.prod{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eef1f5;padding:10px 0;flex-wrap:wrap}
.prod img,.prod .ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#dfe6ef;display:flex;align-items:center;justify-content:center}
.prod .info{flex:1;min-width:160px}
.prod small{color:#667}
.off{color:#c0392b;font-size:.8rem}
#etat{font-weight:600}
.pub{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.pub button{font-size:1rem;padding:12px 24px}
</style></head><body>
<header><h1>Admin · Maison Diagne Senteur</h1><small>Fichier local — ne pas publier sur GitHub</small></header>
<div class="wrap">

<div class="card"><h2>Connexion GitHub</h2>
  <div class="grid2">
    <div><label>Token GitHub (fine-grained, accès « Contents » en écriture)</label><input id="token" type="password" placeholder="github_pat_..."></div>
    <div><label>Compte GitHub</label><input id="owner"><label>Dépôt</label><input id="repo"><label>Branche</label><input id="branch"></div>
  </div>
  <p style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="gris" id="charger">Charger depuis le site</button><span id="etat"></span></p>
  <small style="color:#667">Le token reste enregistré uniquement dans ce navigateur.</small>
</div>

<div class="tabs"><button class="on" data-tab="produits">Produits</button><button data-tab="boutique">Boutique</button></div>

<div id="tab-produits">
  <div class="card"><h2 id="titreForm">Nouveau produit</h2>
    <form id="form">
      <input type="hidden" id="pid">
      <div class="grid2">
        <div><label>Nom</label><input id="nom" required></div>
        <div><label>Catégorie</label><input id="categorie" list="cats" required><datalist id="cats"></datalist></div>
      </div>
      <div class="grid2">
        <div><label>Prix (FCFA)</label><input id="prix" type="number" min="0" required></div>
        <div><label>Quantité (ml)</label><input id="ml" type="number" min="0" placeholder="ex : 100"></div>
      </div>
            <div class="grid2">
        <div><label>Photo</label><input id="photo" type="file" accept="image/*"></div>
        <div><label><input type="checkbox" id="dispo" checked> Disponible à la vente</label></div>
      </div>
      <img id="apercu" style="max-width:140px;margin-top:10px;border-radius:8px;display:none">
      <p style="margin-top:14px;display:flex;gap:10px"><button class="vert" type="submit">Enregistrer le produit</button><button type="button" class="gris" id="annuler">Annuler</button></p>
    </form>
  </div>
  <div class="card"><h2>Catalogue</h2><div id="liste"></div></div>
</div>

<div id="tab-boutique" hidden><div class="card"><h2>Informations de la boutique</h2>
  <div class="grid2">
    <div><label>Nom</label><input data-b="nom"></div>
    <div><label>Slogan</label><input data-b="slogan"></div>
  </div>
  <label>Adresse / emplacement</label><input data-b="adresse">
  <label>Téléphones (un par ligne)</label><textarea data-b="telephones"></textarea>
  <label>WhatsApp (indicatif + numéro, sans espaces)</label><input data-b="whatsapp">
  <label>Horaires</label><input data-b="horaires">
  <label>Présentation de la boutique</label><textarea data-b="presentation"></textarea>
  <label>Message de livraison (affiché sur le site)</label><textarea data-b="livraison"></textarea>
</div></div>

<div class="card pub"><span id="pending"></span><button class="vert" id="publier">📤 Publier sur le site</button></div>
</div>

<script>
const K = "mds_admin_cfg";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let cfg = Object.assign({ owner: "mouhameddiagne33-prog", repo: "boutique", branch: "main", token: "" }, JSON.parse(localStorage.getItem(K) || "{}"));
let produits = [], boutique = {}, enAttente = [];

$("#token").value = cfg.token; $("#owner").value = cfg.owner; $("#repo").value = cfg.repo; $("#branch").value = cfg.branch;

function sauverCfg() {
  cfg = { owner: $("#owner").value.trim(), repo: $("#repo").value.trim(), branch: $("#branch").value.trim() || "main", token: $("#token").value.trim() };
  localStorage.setItem(K, JSON.stringify(cfg));
}
function msg(t, ok = true) { const e = $("#etat"); e.textContent = t; e.style.color = ok ? "#1faa59" : "#c0392b"; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function brut(path) { return `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${path}`; }

async function charger() {
  sauverCfg(); msg("Chargement…");
  try {
    const [p, b] = await Promise.all(["js/produits.js", "js/boutique.js"].map(f =>
      fetch(brut(f) + "?t=" + Date.now()).then(r => { if (!r.ok) throw new Error(f + " (" + r.status + ")"); return r.text(); })));
    produits = new Function(p + "\nreturn PRODUITS;")();
    produits.forEach(x => { if (x.ml === undefined) { x.ml = parseInt(x.taille) || null; delete x.taille; } delete x.description; });
    boutique = new Function(b + "\nreturn BOUTIQUE;")();
    enAttente = []; afficherTout(); msg("Chargé depuis le site ✔");
  } catch (e) { msg("Erreur de chargement : " + e.message, false); }
}
$("#charger").onclick = charger;

function afficherTout() { renderListe(); renderCats(); renderBoutique(); majPending(); }
function majPending() { $("#pending").textContent = enAttente.length ? `${enAttente.length} photo(s) à publier` : "Aucune modification en attente"; }
function renderCats() {
  const cats = [...new Set(produits.map(p => p.categorie).filter(Boolean))];
  $("#cats").innerHTML = cats.map(c => `<option value="${esc(c)}">`).join("");
}
function renderListe() {
  $("#liste").innerHTML = produits.length ? produits.map(p => {
    const src = p._src || (p.image ? brut(p.image) : "");
    const vis = src ? `<img src="${esc(src)}">` : `<div class="ph">🧴</div>`;
    return `<div class="prod">${vis}
      <div class="info"><strong>${esc(p.nom)}</strong><br><small>${esc(p.categorie)} · ${Number(p.prix).toLocaleString("fr-FR")} FCFA · ${p.ml ? p.ml + " ml" : "ml à préciser"}</small>${p.dispo ? "" : ' <span class="off">indisponible</span>'}</div>
      <button class="gris" data-act="dispo" data-id="${p.id}">${p.dispo ? "Mettre indisponible" : "Rendre disponible"}</button>
      <button data-act="edit" data-id="${p.id}">Modifier</button>
      <button class="rouge" data-act="del" data-id="${p.id}">Supprimer</button></div>`;
  }).join("") : "<p>Aucun produit. Cliquez sur « Charger depuis le site ».</p>";
}
$("#liste").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const p = produits.find(x => x.id == b.dataset.id); if (!p) return;
  if (b.dataset.act === "dispo") { p.dispo = !p.dispo; renderListe(); msg("Modifié (non publié)"); }
  if (b.dataset.act === "del") { if (confirm(`Supprimer « ${p.nom} » ?`)) { produits = produits.filter(x => x !== p); renderListe(); msg("Supprimé (non publié)"); } }
  if (b.dataset.act === "edit") {
    $("#pid").value = p.id; $("#nom").value = p.nom; $("#categorie").value = p.categorie;
    $("#prix").value = p.prix; $("#ml").value = p.ml ?? "";
    $("#dispo").checked = !!p.dispo; $("#titreForm").textContent = "Modifier : " + p.nom;
    const src = p._src || (p.image ? brut(p.image) : "");
    $("#apercu").src = src; $("#apercu").style.display = src ? "block" : "none";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

function resetForm() {
  $("#form").reset(); $("#pid").value = ""; $("#dispo").checked = true;
  $("#titreForm").textContent = "Nouveau produit"; $("#apercu").style.display = "none";
}
$("#annuler").onclick = resetForm;

function versJpeg(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const k = Math.min(1, 1000 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL("image/jpeg", 0.85);
        res({ b64: url.split(",")[1], dataUrl: url });
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const id = $("#pid").value;
  let p = id ? produits.find(x => x.id == id) : { id: Math.max(0, ...produits.map(x => x.id)) + 1, image: "" };
  Object.assign(p, {
    nom: $("#nom").value.trim(), categorie: $("#categorie").value.trim(), prix: Number($("#prix").value),
    ml: Number($("#ml").value) || null, dispo: $("#dispo").checked
  });
  const f = $("#photo").files[0];
  if (f) {
    msg("Préparation de la photo…");
    const { b64, dataUrl } = await versJpeg(f);
    const path = `images/p${p.id}-${Date.now()}.jpg`;
    enAttente.push({ path, b64 });
    p.image = path; p._src = dataUrl;
  }
  if (!id) produits.push(p);
  resetForm(); afficherTout(); msg("Produit enregistré (non publié)");
});

function renderBoutique() {
  $$("[data-b]").forEach(el => {
    const v = boutique[el.dataset.b];
    el.value = Array.isArray(v) ? v.join("\n") : (v || "");
  });
}
$$("[data-b]").forEach(el => el.addEventListener("input", () => {
  const k = el.dataset.b;
  boutique[k] = k === "telephones" ? el.value.split("\n").map(s => s.trim()).filter(Boolean) : el.value.trim();
  msg("Modifié (non publié)");
}));

$$(".tabs button").forEach(b => b.onclick = () => {
  $$(".tabs button").forEach(x => x.classList.remove("on")); b.classList.add("on");
  $("#tab-produits").hidden = b.dataset.tab !== "produits";
  $("#tab-boutique").hidden = b.dataset.tab !== "boutique";
});

function utf8b64(s) {
  const bytes = new TextEncoder().encode(s); let bin = "";
  bytes.forEach(x => bin += String.fromCharCode(x)); return btoa(bin);
}
const API = path => `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
const entetes = () => ({ Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" });

async function shaActuel(path) {
  const r = await fetch(API(path) + "?ref=" + cfg.branch, { headers: entetes() });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`lecture de ${path} (${r.status})`);
  return (await r.json()).sha;
}
async function ecrire(path, b64, message) {
  const sha = await shaActuel(path);
  const corps = { message, content: b64, branch: cfg.branch };
  if (sha) corps.sha = sha;
  const r = await fetch(API(path), { method: "PUT", headers: entetes(), body: JSON.stringify(corps) });
  if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(`${path} : ${d.message || r.status}`); }
}

function genProduits() {
  return "// Catalogue (généré par l'admin)\nconst PRODUITS = " +
    JSON.stringify(produits, (k, v) => k.startsWith("_") ? undefined : v, 2) + ";\n";
}
function genBoutique() {
  return "// Informations boutique (généré par l'admin)\nconst BOUTIQUE = " + JSON.stringify(boutique, null, 2) + ";\n";
}

$("#publier").onclick = async () => {
  sauverCfg();
  if (!cfg.token) return msg("Ajoutez le token GitHub", false);
  if (!produits.length && !Object.keys(boutique).length) return msg("Chargez d'abord le site", false);
  try {
    msg("Publication en cours…");
    for (const ph of enAttente) { msg("Envoi de " + ph.path + "…"); await ecrire(ph.path, ph.b64, "Photo produit"); }
    msg("Envoi du catalogue…");
    await ecrire("js/produits.js", utf8b64(genProduits()), "Mise à jour du catalogue");
    msg("Envoi des infos boutique…");
    await ecrire("js/boutique.js", utf8b64(genBoutique()), "Mise à jour des infos boutique");
    enAttente = []; majPending();
    msg("Site publié ✔ (GitHub Pages met 1 à 2 minutes à se mettre à jour)");
  } catch (e) { msg("Erreur : " + e.message, false); }
};

if (cfg.token) charger();
</script>
</body></html>
